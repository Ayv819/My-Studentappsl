<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<body>
    <body>
<script>
if(!localStorage.getItem("currentUser")){ window.location.href = "auth.html"; }
</script>
<header>
<header>
<h2>Study App SL</h2>
<nav><a href="chat.html">Chat Groups</a> <a href="notebook.html">My Notebook</a></nav>
<a href="contacts.html">Contacts</a>
<a href="profile.html">Profile</a>
<h3 id="welcome"></h3>
<script>
let u = JSON.parse(localStorage.getItem("currentUser") || "{}");
document.getElementById("welcome").innerText = "Welcome back, " + (u.name || "Student");
</script>
</header>
<div class="card">
<h1>Study Together. Pass Together.</h1>
<p>Chat with students, share files, send audio messages, and keep your notebook in one place.</p>
<button onclick="location.href='chat.html'">Open Chat Groups</button>
<button onclick="location.href='notebook.html'">Open My Notebook</button>
<button onclick="location.href='contacts.html'">My Contacts</button>
<button onclick="logout()" style="background:#dc2626">Logout</button>
<script>
function logout(){ localStorage.removeItem("currentUser"); window.location.href="auth.html"; }
</script>
</div>
